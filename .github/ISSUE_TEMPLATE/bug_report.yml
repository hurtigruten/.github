name: Bug report
description: Something does not work as expected
type: Bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Where did it happen? For example production, staging, a browser or a version.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Logs, screenshots or other context
      description: Remove secrets and personal data before pasting.
    validations:
      required: false
